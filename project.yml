name: QiblaCar
options:
  bundleIdPrefix: com.theprof06
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ar

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"

targets:
  QiblaCar:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.theprof06.qiblacar
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: القبلة
        CFBundleDevelopmentRegion: ar
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocationWhenInUseUsageDescription: "التطبيق بيستخدم موقعك علشان يحسب اتجاه القبلة بدقة ويعرضه في الأداة على CarPlay."
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.navigation
    dependencies:
      - target: QiblaWidget
    scheme: {}

  QiblaWidget:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.theprof06.qiblacar.widget
        SKIP_INSTALL: YES
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: القبلة
        CFBundleDevelopmentRegion: ar
        NSWidgetWantsLocation: true
        NSLocationWhenInUseUsageDescription: "الأداة بتستخدم موقعك علشان تحسب اتجاه القبلة."
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
